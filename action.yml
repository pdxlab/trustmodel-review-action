name: 'TrustModel Review'
description: 'PR metadata preview with an optional, separately labelled website TrustScore. No PR evaluator is available; no passing gate is issued.'
author: 'pdxlab'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api_key:
    description: 'TrustModel key for recording path-only metadata. No evaluator is available yet.'
    required: false
    default: ''
  github_token:
    description: 'Used only by this Action to publish PR comments and commit statuses; never uploaded to TrustModel.'
    required: false
    default: ${{ github.token }}
  threshold:
    description: 'Requested future evaluator threshold (1-100); server minimum applies.'
    required: false
    default: ''
  framework:
    description: 'Optional framework metadata.'
    required: false
    default: ''
  detect:
    description: 'Comma-separated file-path patterns. Only paths are transmitted, never content.'
    required: false
    default: ''
  base_url:
    description: 'TrustModel gateway origin.'
    required: false
    default: 'https://api.trustmodel.ai'
  website_domain:
    description: 'Optional explicit public domain for an informational website TrustScore. Never affects PR evaluation or its gate. Blank disables scanning.'
    required: false
    default: ''
outputs:
  website_domain:
    description: 'Explicit domain assessed separately from the PR.'
  website_scan_status:
    description: 'disabled, assessed, or unavailable; never a PR gate decision.'
  website_trust_score:
    description: 'Informational website score, empty when unavailable or disabled. Never a PR score.'
  status:
    description: 'not_available, passed, failed, or error. This preview returns not_available.'
  passed:
    description: 'True only for an explicit server-verified PR diff evaluation pass.'
  pr_diff_evaluated:
    description: 'Whether the server actually evaluated the PR diff.'
  trust_score:
    description: 'Empty unless the server evaluated the PR diff.'
  report_url:
    description: 'Optional verified evaluation report.'

runs:
  using: 'node20'
  main: 'dist/index.js'
