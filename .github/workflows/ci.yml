name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & verify dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Contract and regression tests
        run: npm test

      - name: Build dist/index.js
        run: npm run build

      - name: Built Action and runner website integration
        run: python3 tests/website_e2e.py

      - name: Verify dist is committed and up to date
        run: |
          if ! git diff --quiet dist/; then
            echo "::error::dist/index.js is out of date. Run 'npm run build' and commit."
            git diff dist/
            exit 1
          fi

      - name: Check action.yml is valid
        run: node -e "require('js-yaml').load(require('fs').readFileSync('action.yml','utf8')); console.log('action.yml valid')"
